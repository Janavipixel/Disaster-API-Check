# ==============================================================================
# Sentinel-1 Disaster Change Detection Configuration
# ==============================================================================
# Run identifier and target event
name: "nepal_trishuli_landslide"
event_date: "2026-08-26"

# Area of Interest (AOI): runout corridor, Bhote Kosi -> Trishuli (Rasuwa, Nuwakot, Dhading)
# Option A: Explicit bounding box [west, south, east, north] in WGS84 (EPSG:4326)
bbox: [85.10, 27.88, 85.56, 28.34]

# Option B: Center coordinate and extent in km (uncomment to use instead of bbox)
# center_lat: 28.11
# center_lon: 85.33
# size_km: 50.0

# Search parameters
pre_window_days: 24      # at least 2 pre-event passes
post_window_days: 20     # first post-event passes; later ones get dominated by cleanup and rain
resolution_m: 20.0       # use 10.0 for the narrow river channel if file size allows

# Quality and coverage guardrails
min_aoi_coverage_pct: 95.0
min_valid_pixel_pct: 85.0      # relaxed slightly: steep Himalayan valleys lose pixels to layover/shadow

# Optional orbit filters: leave commented on the first run so the pipeline ranks
# all orbits, then pin the best one for reproducibility.
# orbit_direction: "DESCENDING"
# relative_orbit: 12

# Change detection tuning
threshold_method: "adaptive_std"
k_std: 2.0                      # higher than flood runs: slope speckle gives false positives
min_area_m2: 1000.0
